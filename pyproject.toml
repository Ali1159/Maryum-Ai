[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maryum-ai"
version = "0.1.0"
description = "Lightweight Linux desktop voice assistant for Gemini Live"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
maryum = "maryum_ai.main:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
